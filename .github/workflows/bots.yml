name: Bots de trading (Paper)

on:
  schedule:
    # Un arranque antes de abrir la bolsa (13:30 UTC en verano, 14:30 en invierno) hace todo el día
    # (ver ciclo.sh). Los otros son de reserva por si GitHub se salta o retrasa alguno:
    # si ya hay uno trabajando, esperan en cola y al entrar ven que no queda nada por hacer.
    - cron: "40 12 * * 1-5"
    - cron: "10 14 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "45 21 * * 1-5"
  workflow_dispatch:
    inputs:
      colonia:
        description: "Qué ejecutar"
        type: choice
        options: [ciclo, diaria, tendencia, skill]
        default: ciclo

concurrency:
  group: bots          # nunca dos ejecuciones a la vez (comparten el estado)
  cancel-in-progress: false

permissions:
  contents: write      # para guardar el estado de los bots en el repositorio
  actions: write       # para relanzarse antes del límite de 6 h

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      GH_TOKEN: ${{ github.token }}
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ciclo del día (diaria + skill cada 15 min, tendencia al cierre)
        if: github.event_name == 'schedule' || inputs.colonia == 'ciclo'
        run: bash ciclo.sh

      - name: Colonia de tendencia (manual)
        if: inputs.colonia == 'tendencia'
        run: python bot_alpaca.py

      - name: Colonia diaria (manual)
        if: inputs.colonia == 'diaria'
        run: python bot_diario.py

      - name: Colonia skill (manual)
        if: inputs.colonia == 'skill'
        run: python bot_skill.py

      - name: Guardar estado (ejecuciones manuales)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.colonia != 'ciclo'
        run: |
          python panel.py || true
          git config user.name "bot-trading"
          git config user.email "bot-trading@users.noreply.github.com"
          for f in colonia.json colonia_diaria.json colonia_skill.json historial.csv registro.log panel.html; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || (git commit -m "Estado de los bots $(date '+%Y-%m-%d %H:%M')" && git pull --rebase && git push)
