name: Bots de trading (Paper)

on:
  schedule:
    # El ciclo (ciclo.sh) trabaja 24/7 y se relanza solo antes del límite de 6 h.
    # Este horario es de RESERVA: si la cadena se rompe, en menos de 1 h vuelve a arrancar.
    # Si ya hay uno trabajando, el nuevo espera en cola (concurrency) y no se pisan.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      colonia:
        description: "Qué ejecutar"
        type: choice
        options: [ciclo, diaria, tendencia, skill, cripto]
        default: ciclo

concurrency:
  group: bots          # nunca dos ejecuciones a la vez (comparten el estado)
  cancel-in-progress: false

permissions:
  contents: write      # para guardar el estado de los bots en el repositorio
  actions: write       # para relanzarse antes del límite de 6 h

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      GH_TOKEN: ${{ github.token }}
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ciclo 24/7 (cripto siempre, diaria + skill con bolsa abierta, tendencia al cierre)
        if: github.event_name == 'schedule' || inputs.colonia == 'ciclo'
        run: bash ciclo.sh

      - name: Colonia de tendencia (manual)
        if: inputs.colonia == 'tendencia'
        run: python bot_alpaca.py

      - name: Colonia diaria (manual)
        if: inputs.colonia == 'diaria'
        run: python bot_diario.py

      - name: Colonia skill (manual)
        if: inputs.colonia == 'skill'
        run: python bot_skill.py

      - name: Colonia cripto (manual)
        if: inputs.colonia == 'cripto'
        run: python bot_cripto.py

      - name: Guardar estado (ejecuciones manuales)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.colonia != 'ciclo'
        run: |
          python panel.py || true
          git config user.name "bot-trading"
          git config user.email "bot-trading@users.noreply.github.com"
          for f in colonia.json colonia_diaria.json colonia_skill.json colonia_cripto.json historial.csv registro.log panel.html; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || (git commit -m "Estado de los bots $(date '+%Y-%m-%d %H:%M')" && git pull --rebase && git push)
